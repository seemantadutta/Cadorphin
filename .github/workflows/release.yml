name: Release

# Pushing a tag like v1.0.0 builds the installers and attaches them, with the updater's
# latest.json, to a draft GitHub Release. Check the draft, then publish it: the app's updater
# only sees published releases. Running the workflow by hand builds without releasing and
# keeps the installers as workflow artifacts, for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $v (app/src-tauri/tauri.conf.json)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Cache the Python download
        uses: actions/cache@v4
        with:
          path: .cache/python-build-standalone
          key: pbs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bundle_python.py') }}

      - name: Bundle Python with cadkit
        run: python scripts/bundle_python.py

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build (and release, for a tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Cadorphin v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Install

            **Windows:** download `Cadorphin_${{ github.ref_name }}_x64-setup.exe` and run it. It installs for your user only, no admin rights needed. The installer isn't code-signed yet, so Windows SmartScreen may warn you: choose **More info → Run anyway**.

            **macOS (Apple Silicon):** download the `.dmg` and drag Cadorphin to Applications. The app isn't notarized yet, so the first time you open it macOS blocks it: open **System Settings → Privacy & Security**, scroll down and choose **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/Cadorphin.app` once.

            Cadorphin includes its own Python and CAD engine. For the agent loop, install a coding agent such as [Claude Code](https://claude.com/claude-code) separately.

            Later versions install themselves: Cadorphin checks for updates at startup, and from **Help → Check for Updates…**.

      - name: Keep the installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cadorphin-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
