[package]
name = "cadorphin"
version = "0.1.0"
description = "Design 3D-printable parts by talking to your coding agent"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cadorphin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.5"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
# Job objects: the app's child processes (terminals, agents, the CAD engine) die with it.
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
